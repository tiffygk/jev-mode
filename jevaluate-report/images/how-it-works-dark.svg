<text x="34.0" y="82.0" font-size="16" fill="#f0efec">Claude or Codex reads the rating you agreed with</text>
<text x="34.0" y="105.0" font-size="16" fill="#f0efec">and your code at the commit it rated.</text>
<line x1="246.0" y1="123.0" x2="246.0" y2="158.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="161.0" width="452.0" height="150.0" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
<circle cx="46" cy="186.0" r="12" fill="#f0efec"/>
<text x="46.0" y="191.0" font-size="14" fill="#1a1a19" font-weight="700" text-anchor="middle">2</text>
<text x="68.0" y="192.0" font-size="17" fill="#f0efec" font-weight="700">Read the docs</text>
<rect x="395.8" y="175.0" width="62.2" height="22" rx="4" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
<text x="426.9" y="190.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">CODE</text>
<text x="34.0" y="223.0" font-size="16" fill="#f0efec">Jev Sources finds the TypeSafe docs and cookbook</text>
<text x="34.0" y="246.0" font-size="16" fill="#f0efec">sections behind each fix. Each fix keeps its source</text>
<text x="34.0" y="269.0" font-size="16" fill="#f0efec">label; one Claude or Codex can't quote is dropped.</text>
<text x="34.0" y="297.0" font-size="14" fill="#c3c2b7" font-style="italic">Claude or Codex quotes them</text>
<line x1="246.0" y1="313.0" x2="246.0" y2="348.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="351.0" width="452.0" height="124.0" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="46" cy="376.0" r="12" fill="#f0efec"/>
<text x="46.0" y="381.0" font-size="14" fill="#1a1a19" font-weight="700" text-anchor="middle">3</text>
<text x="68.0" y="382.0" font-size="17" fill="#f0efec" font-weight="700">Check the numbers</text>
<rect x="321.2" y="365.0" width="136.8" height="22" rx="4" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="4 3"/>
<text x="389.6" y="380.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">INSTRUCTIONS</text>
<text x="34.0" y="413.0" font-size="16" fill="#f0efec">Only when the project publishes eval results: each</text>
<text x="34.0" y="436.0" font-size="16" fill="#f0efec">headline figure gets its sample size, baseline and</text>
<text x="34.0" y="459.0" font-size="16" fill="#f0efec">interval.</text>
<line x1="246.0" y1="477.0" x2="246.0" y2="512.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="515.0" width="452.0" height="124.0" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="46" cy="540.0" r="12" fill="#f0efec"/>
<text x="46.0" y="545.0" font-size="14" fill="#1a1a19" font-weight="700" text-anchor="middle">4</text>
<text x="68.0" y="546.0" font-size="17" fill="#f0efec" font-weight="700">Draft</text>
<rect x="321.2" y="529.0" width="136.8" height="22" rx="4" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="4 3"/>
<text x="389.6" y="544.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">INSTRUCTIONS</text>
<text x="34.0" y="577.0" font-size="16" fill="#f0efec">Each fix is re-checked at the commit and ranked.</text>
<text x="34.0" y="600.0" font-size="16" fill="#f0efec">Each gets five parts: what we saw, why it matters,</text>
<text x="34.0" y="623.0" font-size="16" fill="#f0efec">the source, a change to try, how to check it.</text>
<circle cx="472" cy="552.0" r="3.5" fill="#898781"/>
<path d="M475.5,552.0 H504.0" fill="none" stroke="#898781" stroke-width="1"/>
<line x1="512.0" y1="544.0" x2="512.0" y2="612.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<text x="526.0" y="556.0" font-size="13" fill="#c3c2b7" font-weight="700">Advice</text>
<text x="526.0" y="584.0" font-size="15" fill="#c3c2b7" font-style="italic">Every fix is a change to try, with</text>
<text x="526.0" y="605.0" font-size="15" fill="#c3c2b7" font-style="italic">a pass line set before the test.</text>
<line x1="246.0" y1="641.0" x2="246.0" y2="676.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="679.0" width="452.0" height="124.0" rx="6" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
<circle cx="46" cy="704.0" r="12" fill="#f0efec"/>
<text x="46.0" y="709.0" font-size="14" fill="#1a1a19" font-weight="700" text-anchor="middle">5</text>
<text x="68.0" y="710.0" font-size="17" fill="#f0efec" font-weight="700">Checkers</text>
<rect x="395.8" y="693.0" width="62.2" height="22" rx="4" fill="#1a1a19" stroke="#3987e5" stroke-width="2"/>
<text x="426.9" y="708.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">CODE</text>
<text x="34.0" y="741.0" font-size="16" fill="#f0efec">Scripts check for the five labels and commit-pinned</text>
<text x="34.0" y="764.0" font-size="16" fill="#f0efec">links, and flag promised results, private words and</text>
<text x="34.0" y="787.0" font-size="16" fill="#f0efec">quotes not found in the docs or code.</text>
<line x1="246.0" y1="805.0" x2="246.0" y2="840.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="843.0" width="452.0" height="124.0" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="46" cy="868.0" r="12" fill="#f0efec"/>
<text x="46.0" y="873.0" font-size="14" fill="#1a1a19" font-weight="700" text-anchor="middle">6</text>
<text x="68.0" y="874.0" font-size="17" fill="#f0efec" font-weight="700">Review agent</text>
<rect x="321.2" y="857.0" width="136.8" height="22" rx="4" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="4 3"/>
<text x="389.6" y="872.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">INSTRUCTIONS</text>
<text x="34.0" y="905.0" font-size="16" fill="#f0efec">One fresh agent checks each docs claim and reads</text>
<text x="34.0" y="928.0" font-size="16" fill="#f0efec">the opening as a newcomer would. The checkers</text>
<text x="34.0" y="951.0" font-size="16" fill="#f0efec">rerun after any edit.</text>
<rect x="512.0" y="843.0" width="268.0" height="173.0" rx="6" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="474" y1="905.0" x2="509" y2="905.0" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="526.0" y="867.0" font-size="13" fill="#c3c2b7" font-weight="700" letter-spacing="0.6">SIDE PATH</text>
<text x="526.0" y="891.0" font-size="16" fill="#f0efec" font-weight="700">Your</text>
<text x="526.0" y="912.0" font-size="16" fill="#f0efec" font-weight="700">agents fix</text>
<rect x="629.2" y="875.0" width="136.8" height="22" rx="4" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="4 3"/>
<text x="697.6" y="890.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">INSTRUCTIONS</text>
<text x="526.0" y="938.0" font-size="15" fill="#f0efec">You point your coding agents at</text>
<text x="526.0" y="959.0" font-size="15" fill="#f0efec">the file. Each runs a fix's test</text>
<text x="526.0" y="980.0" font-size="15" fill="#f0efec">before and after the change;</text>
<text x="526.0" y="1001.0" font-size="15" fill="#f0efec">you keep what passes.</text>
