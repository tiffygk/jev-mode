<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1142" viewBox="0 0 800 1142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
