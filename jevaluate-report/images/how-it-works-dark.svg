<text x="51.1" y="1075.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">CODE</text>
<text x="168.8" y="1076.0" font-size="15" fill="#f0efec">A script does this step.</text>
<rect x="20.0" y="1094.0" width="136.8" height="22" rx="4" fill="#1a1a19" stroke="#d95926" stroke-width="2" stroke-dasharray="4 3"/>
<text x="88.4" y="1109.5" font-size="13" fill="#f0efec" font-weight="700" text-anchor="middle" letter-spacing="0.6">INSTRUCTIONS</text>
<text x="168.8" y="1110.0" font-size="15" fill="#f0efec">Claude or Codex follows the steps in SKILL.md.</text>
